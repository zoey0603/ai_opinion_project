{% extends "base.html" %}
{% block content %}

<style>
  .page-wrap {
    max-width: 1180px;
    margin: 0 auto;
    padding: 40px 24px 60px;
  }

  .hero-card {
    background: linear-gradient(135deg, #ffffff, #f7fbff);
    border-radius: 24px;
    padding: 36px 40px;
    margin-bottom: 28px;
    box-shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
  }

  .hero-card h1 {
    margin: 0 0 10px;
    font-size: 32px;
    font-weight: 800;
    color: #1f2937;
  }

  .hero-card p {
    margin: 0;
    color: #6b7280;
    font-size: 16px;
  }

  .toolbar-card {
    background: #ffffff;
    border-radius: 20px;
    padding: 22px 26px;
    margin-bottom: 28px;
    box-shadow: 0 10px 28px rgba(15, 23, 42, 0.07);
  }

  .toolbar {
    display: flex;
    align-items: end;
    gap: 18px;
    flex-wrap: wrap;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 180px;
  }

  .field label {
    font-weight: 700;
    color: #374151;
  }

  .field select,
  .field input {
    height: 42px;
    border: 1px solid #d1d5db;
    border-radius: 12px;
    padding: 0 14px;
    font-size: 15px;
    outline: none;
  }

  .field select:focus,
  .field input:focus {
    border-color: #60a5fa;
    box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.18);
  }

  .btn {
    height: 42px;
    padding: 0 24px;
    border: none;
    border-radius: 12px;
    background: #2563eb;
    color: white;
    font-weight: 700;
    cursor: pointer;
  }

  .btn:hover {
    background: #1d4ed8;
  }

  .content-grid {
    display: grid;
    grid-template-columns: minmax(0, 1.4fr) minmax(320px, 0.6fr);
    gap: 28px;
    align-items: start;
  }

  .section-card {
    background: #ffffff;
    border-radius: 24px;
    padding: 28px;
    box-shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
  }

  .section-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
  }

  .section-title h2 {
    margin: 0;
    font-size: 24px;
    color: #1f2937;
  }

  .badge {
    display: inline-block;
    padding: 6px 12px;
    border-radius: 999px;
    background: #eff6ff;
    color: #2563eb;
    font-size: 14px;
    font-weight: 700;
  }

  .wordcloud-box {
    width: 100%;
    height: 430px;
    border-radius: 20px;
    background: #fbfdff;
    border: 1px solid #eef2f7;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  #kwCloud {
    display: block;
    width: 100%;
    height: 100%;
  }

  .table-wrap {
    overflow-x: auto;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  th {
    background: #f3f4f6;
    color: #374151;
    font-weight: 800;
    text-align: left;
    padding: 12px;
  }

  td {
    padding: 12px;
    border-bottom: 1px solid #e5e7eb;
    color: #374151;
  }

  tbody tr:hover {
    background: #f9fafb;
  }

  .rank {
    width: 64px;
    font-weight: 800;
    color: #2563eb;
  }

  .keyword {
    font-weight: 700;
  }

  @media (max-width: 900px) {
    .content-grid {
      grid-template-columns: 1fr;
    }

    .hero-card {
      padding: 28px;
    }

    .hero-card h1 {
      font-size: 26px;
    }

    .wordcloud-box {
      height: 360px;
    }
  }
</style>

<div class="page-wrap">

  <section class="hero-card">
    <h1>熱門關鍵字分析</h1>
    <p>查看不同 AI 工具在新聞資料中的高頻關鍵字，快速掌握討論焦點。</p>
  </section>

  <section class="toolbar-card">
    <form method="get" class="toolbar">
      <div class="field">
        <label for="tool">工具</label>
        <select id="tool" name="tool">
          {% for t in tools %}
            <option value="{{ t }}" {% if t == tool %}selected{% endif %}>{{ t }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="field">
        <label for="topn">顯示關鍵字數量</label>
        <input id="topn" type="number" name="topn" value="{{ topn }}" min="5" max="100">
      </div>

      <div class="field" style="min-width: 140px;">
        <button class="btn" type="submit">查詢結果</button>
      </div>
    </form>
  </section>

  <div class="content-grid">

    <section class="section-card">
      <div class="section-title">
        <h2>{{ tool }} 熱門關鍵字雲</h2>
        <span class="badge">Top {{ topn }}</span>
      </div>

      <div class="wordcloud-box">
        <canvas id="kwCloud"></canvas>
      </div>
    </section>

    <section class="section-card">
      <div class="section-title">
        <h2>關鍵字統計表</h2>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>排名</th>
              <th>關鍵字</th>
              <th>次數</th>
            </tr>
          </thead>
          <tbody>
            {% for k, v in keyword_pairs %}
              <tr>
                <td class="rank">#{{ forloop.counter }}</td>
                <td class="keyword">{{ k }}</td>
                <td>{{ v }}</td>
              </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    </section>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/wordcloud@1.2.2/src/wordcloud2.min.js"></script>

<script>
const labels = {{ labels|safe }};
const values = {{ values|safe }};

const canvas = document.getElementById("kwCloud");
const box = document.querySelector(".wordcloud-box");

function resizeCanvas() {
  canvas.width = box.clientWidth;
  canvas.height = box.clientHeight;
}

function drawWordCloud() {
  resizeCanvas();

  const maxValue = Math.max(...values);
  const minValue = Math.min(...values);

  const wordList = labels.map((word, index) => {
    const value = values[index];

    let size = 28;

    if (maxValue !== minValue) {
      size = 22 + ((value - minValue) / (maxValue - minValue)) * 58;
    } else {
      size = 46;
    }

    return [word, size];
  });

  WordCloud(canvas, {
    list: wordList,

    weightFactor: function(size) {
      return size;
    },

    fontFamily: "Microsoft JhengHei, Noto Sans TC, sans-serif",
    backgroundColor: "#fbfdff",

    gridSize: 10,
    rotateRatio: 0,
    minRotation: 0,
    maxRotation: 0,
    rotationSteps: 0,

    drawOutOfBound: false,
    shrinkToFit: true,

    origin: [canvas.width / 2, canvas.height / 2],

    color: function () {
      const colors = [
        "#ef4444",
        "#f59e0b",
        "#10b981",
        "#06b6d4",
        "#3b82f6",
        "#8b5cf6",
        "#ec4899"
      ];
      return colors[Math.floor(Math.random() * colors.length)];
    }
  });
}

drawWordCloud();

window.addEventListener("resize", function () {
  drawWordCloud();
});
</script>

{% endblock %}
