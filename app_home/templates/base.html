<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 工具輿情觀測站</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      --radius: 18px;
      --radius-sm: 12px;
      --container: 1160px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: linear-gradient(180deg, #eef4ff 0%, var(--bg) 220px);
      color: var(--text);
      line-height: 1.6;
    }
    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; display: block; }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(12px);
      background: rgba(255, 255, 255, 0.88);
      border-bottom: 1px solid rgba(229, 231, 235, 0.8);
    }
    .header-inner, .container {
      width: min(var(--container), calc(100% - 32px));
      margin: 0 auto;
    }
    .header-inner {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 12px 0;
    }
    .brand { display: flex; flex-direction: column; gap: 2px; min-width: 220px; }
    .brand-title { font-size: 1.1rem; font-weight: 800; }
    .brand-subtitle { font-size: 0.88rem; color: var(--muted); }
    .nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
      align-items: center;
    }
    .nav a, .nav-label {
      padding: 9px 12px;
      border-radius: 999px;
      color: #334155;
      font-weight: 700;
      font-size: 0.95rem;
      transition: 0.2s ease;
      white-space: nowrap;
    }
    .nav-label {
      background: #f1f5f9;
      color: #475569;
    }
    .nav a:hover, .nav a:focus-visible {
      background: #dbeafe;
      color: var(--primary-dark);
      outline: none;
    }
    .main { padding: 36px 0 56px; }

    .hero, .section-card, .stat-card, .result-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .hero { padding: 28px; margin-bottom: 24px; }
    h1 {
      margin: 0 0 10px;
      font-size: clamp(1.8rem, 3vw, 2.5rem);
      line-height: 1.2;
    }
    h2 { margin: 0 0 14px; font-size: 1.25rem; }
    h3 { margin: 16px 0 10px; }
    p { margin: 0 0 12px; }
    .lead { font-size: 1.02rem; color: #374151; max-width: 76ch; }

    .meta-list {
      list-style: none;
      margin: 18px 0 0;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }
    .meta-item, .stat-card {
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 16px 18px;
    }
    .meta-label, .stat-label {
      font-size: 0.92rem;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .meta-value, .stat-value {
      font-size: 1.18rem;
      font-weight: 800;
      color: var(--text);
      word-break: break-word;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      margin-top: 18px;
    }
    .section-card { padding: 24px; margin-bottom: 24px; }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: end;
      margin-bottom: 10px;
    }
    .field { display: flex; flex-direction: column; gap: 8px; min-width: 180px; flex: 1 1 220px; }
    label { font-size: 0.95rem; font-weight: 700; color: #374151; }
    select, input[type="number"], input[type="date"], input[type="text"], textarea {
      width: 100%;
      border: 1px solid #cbd5e1;
      background: #fff;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 1rem;
      color: var(--text);
      font-family: inherit;
    }
    select:focus, input:focus, textarea:focus {
      border-color: var(--primary);
      outline: 3px solid rgba(37, 99, 235, 0.14);
    }
    .btn {
      appearance: none;
      border: 0;
      background: linear-gradient(135deg, var(--primary), #3b82f6);
      color: #fff;
      padding: 12px 18px;
      border-radius: 12px;
      font-size: 0.98rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.2);
    }
    .btn:hover { background: linear-gradient(135deg, var(--primary-dark), var(--primary)); }
    .chart-wrap { position: relative; width: 100%; min-height: 320px; height: 48vh; max-height: 460px; }
    .table-wrap { width: 100%; overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: #fff; }
    table { width: 100%; min-width: 640px; border-collapse: collapse; }
    th, td { padding: 14px 16px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { background: #eff6ff; color: #1e3a8a; font-size: 0.95rem; font-weight: 800; white-space: nowrap; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #f8fbff; }
    .result-card { margin-top: 20px; padding: 22px; background: linear-gradient(180deg, #ffffff 0%, #f8fbff 100%); }
    .footer-note { margin-top: 10px; color: var(--muted); font-size: 0.92rem; }

    @media (max-width: 980px) {
      .header-inner { flex-direction: column; align-items: flex-start; }
      .nav { justify-content: flex-start; }
      .stats-grid, .meta-list { grid-template-columns: 1fr; }
    }
    @media (max-width: 640px) {
      .header-inner, .container { width: min(var(--container), calc(100% - 20px)); }
      .main { padding-top: 20px; }
      .hero, .section-card, .result-card { padding: 18px; border-radius: 16px; }
      .nav { width: 100%; gap: 6px; }
      .nav a, .nav-label { padding: 8px 10px; font-size: 0.9rem; }
      .toolbar { flex-direction: column; align-items: stretch; }
      .field { min-width: 100%; }
      .btn { width: 100%; }
      .chart-wrap { min-height: 260px; height: 340px; }
      table { min-width: 560px; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="/">
        <span class="brand-title">AI 工具輿情觀測站</span>
        <span class="brand-subtitle">新聞聲量、情緒、關鍵字與智慧分析</span>
      </a>
      <nav class="nav" aria-label="主要導覽">
        <a href="/">首頁</a>
        <a href="/topword/">熱門關鍵字</a>
        <a href="/trend/">聲量趨勢</a>
        <a href="/compare/">工具比較</a>
        <a href="/recommend/">工具推薦器</a>
        <a href="http://127.0.0.1:8001/admin/">資料庫管理</a>
        <a href="/ai-report/">AI 分析報告</a>
        <a href="/ai-digest/">AI 新聞懶人包生成器</a>
        <a href="/risk-alert/">AI 工具風險警報器</a>
        <a href="/hot-event/">AI 工具爆紅原因分析</a>
        <a href="/classification/">文字分類</a>
      </nav>
    </div>
  </header>

  <main class="main">
    <div class="container">
      {% block content %}{% endblock %}
    </div>
  </main>
</body>
</html>
